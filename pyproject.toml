[project.urls]
homepage = 'https://github.com/WGBH-MLA/chowda'
documentation = 'https://WGBH-MLA.github.io/chowda/'
repository = 'https://github.com/WGBH-MLA/chowda'

[project]
name = 'chowda'
version = "0.7.0"
description = 'A CLAMS processing application'
authors = [{ name = 'WGBH-MLA', email = 'ryan_harbert@wgbh.org' }]
requires-python = '>=3.10,<4.0'
readme = 'README.md'
license = "MIT"
dependencies = [
    "fastapi>=0.141.1",
    "starlette-admin~=0.14",
    "sqlmodel~=0.0",
    "pydantic[email]~=2.12",
    "sonyci>=0.8.0,<0.9",
    "psycopg2-binary~=2.9",
    "metaflow>=2.19.31,<2.20",
    "alembic~=1.13",
    "alembic-postgresql-enum>=1.10.0",
    "python-dotenv~=1.0",
    "itsdangerous~=2.2",
    "httpx~=0.27",
    "fastapi-cache2~=0.2",
    "pyjwt~=2.9",
    "authlib>=1.7.0",
]
[dependency-groups]
dev = [
    "uvicorn~=0.32",
    "black>=26.3.1",
    "ruff>=0.15.12",
    "pre-commit>=4.6.0",
    "rich>=15.0.0",
]
[project.optional-dependencies]
production = ["uvicorn[standard]~=0.32", "gunicorn~=25.0"]
test = [
    "factory-boy~=3.3",
    "pytest~=9.0",
    "pytest-cov~=7.0",
    "pytest-sugar~=1.0",
    "pytest-xdist~=3.6",
    "nbmake~=1.5",
    "vcrpy~=8.0",
    "pytest-vcr~=1.0",
    "urllib3~=2.6",
    "pytest-mock~=3.14",
    "pytest-asyncio~=1.3",
    "trio~=0.26",
]

docs = [
    "mkdocs~=1.6",
    "mkdocs-material~=9.5",
    "mkdocs-git-revision-date-localized-plugin~=1.2",
    "mike~=2.1",
    "mkdocstrings[python]~=0.26",
    "mkdocs-jupyter~=0.24",
]

locust = ["locust~=2.25", "pydantic-factories~=1.17"]
k8s = ["kubernetes~=35.0"]
cli = ["typer>=0.26.7"]


[tool.black]
extend-exclude = 'migrations'

[tool.coverage.run]
omit = ['tests/*']

[tool.pytest.ini_options]
testpaths = ['tests', 'docs']

[tool.ruff]
extend-exclude = ['migrations', 'docs']

[tool.ruff.format]
quote-style = 'single'

[tool.lint]
ignore = ['Q000']
select = [
    'B',   # flake8-bugbear
    'C4',  # flake8-comprehensions
    'C90', # mccabe
    'E',   # pycodestyle errors
    'ERA', # eradicate
    'F',   # pyflakes
    # 'I', # isort
    'INT', # flake8-gettext
    'N',   # pep8-naming
    'PIE', # flake8-pie,
    'PLC', # pylint - convention
    'PLE', # pylint - error
    'PLW', # pylint - warning
    'Q',   # flake8-quotes
    'RET', # flake8-return,
    'RUF', # Ruff-specific rules
    'SIM', # flake8-simplify
    'UP',  # pyupgrade
    'W',   # pycodestyle warnings

]


[project.scripts]
# dev = 'uvicorn chowda.app:app --reload'
# docs = 'mkdocs serve'
# format = 'black -S .'
# lint = 'ruff .'
# migrate = 'alembic upgrade head'
# test = 'pytest'

[build-system]
requires = ["uv_build>=0.12.5,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
