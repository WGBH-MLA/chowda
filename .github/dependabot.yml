version: 2
updates:
# GitHub Actions
- package-ecosystem: github-actions
  directory: .github/workflows
  schedule:
    interval: weekly
    day: wednesday
    time: '06:00'
    timezone: US/Eastern
  commit-message:
    prefix: ⬆
  cooldown:
    default-days: 1
    semver-major-days: 3
  labels:
  - maintenance 🔧

# uv
- package-ecosystem: uv
  directory: /
  schedule:
    interval: weekly
    day: wednesday
    time: '06:00'
    timezone: US/Eastern
  commit-message:
    prefix: ⬆
  cooldown:
    default-days: 3
    semver-major-days: 7
  labels:
  - maintenance 🔧
  groups:
    dev:
      patterns:
      - black
      - pre-commit
      - rich
      - ruff
      - trogon
      - typer
      - uv
    docs:
      patterns:
      - mkdocs*
      - mike*
    tests:
      patterns:
      - pytest*
      - urllib3
      - vcrpy*
    production:
      patterns:
      - boto3
      - botocore
      - gunicorn
      - kubernetes
      - metaflow
      - uvicorn*
