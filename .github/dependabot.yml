version: 2
updates:
# GitHub Actions
- package-ecosystem: github-actions
  directory: .github/workflows
  schedule:
    interval: weekly
    day: wednesday
    time: '06:00'
    timezone: US/Eastern
  commit-message:
    prefix: ⬆
  cooldown:
    default-days: 1
  labels:
  - maintenance 🔧

# uv
- package-ecosystem: uv
  directory: /
  schedule:
    interval: weekly
    day: wednesday
    time: '06:00'
    timezone: US/Eastern
  commit-message:
    prefix: ⬆
  cooldown:
    default-days: 3
    semver-major-days: 7
  labels:
  - maintenance 🔧
  groups:
    core:
      patterns:
      - fastapi
      - starlette-admin
      - pydantic*
      - sonyci
      - metaflow
    database:
      patterns:
      - psycopg2*
      - alembic*
      - sqlmodel
    dev:
      patterns:
      - black
      - pre-commit
      - rich
      - ruff
      - trogon
      - typer
      - uv
    docs:
      patterns:
      - mkdocs*
      - mike*
    tests:
      patterns:
      - pytest*
      - urllib3
      - vcrpy*
      - factory-boy
      - nbmake
      - urllib3
      - trio
    production:
      patterns:
      - boto3
      - botocore
      - gunicorn
      - kubernetes
      - metaflow
      - uvicorn*
    utilities:
      patterns:
      - python-dotenv
      - itsdangerous
      - httpx
      - fastapi-cache2
      - pyjwt
      - authlib
      - kubernetes
      - pydantic-factories
      - locust
    cli:
      patterns:
      - typer
